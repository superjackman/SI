<main><h1>作品</h1><p>三个能在浏览器里做完的作品。用的是固定样本，不是联网模型。</p><ul><li><a href="/SI/s/w/kb/">带引用的微型知识库</a> — 问“班车几点从东门发车？”，回答是 7:40，依据纸条 A 的原句。</li><li><a href="/SI/s/w/ask/">先问你再做事的助手</a> — 先出现问题“要发给项目组吗？”，此时还没有“已发出”。点头之后才有“已发出（样本）”。</li><li><a href="/SI/s/w/fix/">带着测试结果改一处错误</a> — 按规则改之后，1 公里得到 3，3 公里得到 7。两道都对。</li></ul><p class="open"><a href="/SI/#W">▶ 打开互动版（能点图、做实验、做小测）</a></p></main></body></html>
