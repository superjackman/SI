<script>
/* /SI/next/ was the preview address of the new app during the migration; the app now lives at /SI/.
   Keep shared links working: same query (?lang=…) and hash (#T3, #T3&lang=en), minus the cache-busting _r marker. */
(function () {
  var l = location, s = (l.search || '').replace(/[?&]_r=[^&]*/g, '').replace(/^&/, '?');
  try { l.replace('../' + s + l.hash); } catch (e) { l.href = '../' + s + l.hash; }
})();
</script>
